<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Matty Toilet Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#8655C6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matty Toilet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-thumb phone app — a status header, one question per screen, big picture buttons in a 2-column grid */
:root{
  --bg:#FBF8FE; --surface:#FFFFFF; --ink:#2A1A36; --muted:#6F6380; --line:#E7DEF1;
  --brand:#8655C6; --brand-2:#A57EDC; --brand-soft:#F2EBFB;
  --ok:#1F7A3D; --ok-bg:#E4F5E8; --warn:#8F5A0B; --warn-bg:#FFF3DF; --bad:#A3241C; --bad-bg:#FCE6E4;
  --font:"Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:18px; color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;gap:14px}
/* header */
.top{display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0}
.who h1{font-size:22px;margin:0;line-height:1.1;text-wrap:balance}
.who p{margin:2px 0 0;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);white-space:nowrap}
.pill.lvl{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill.sync-ok{color:var(--ok)} .pill.sync-wait{color:var(--warn);background:var(--warn-bg);border-color:transparent} .pill.sync-demo{color:var(--muted)}
.iconbtn{border:0;background:transparent;font-size:24px;padding:6px;border-radius:12px;cursor:pointer}
.iconbtn:focus-visible,.big:focus-visible,.choice:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
/* banners */
.banner{border-radius:var(--r);padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.banner .e{font-size:22px;line-height:1}
.banner.demo{background:var(--brand-soft);color:var(--ink);font-weight:400;font-size:15px}
.banner.up{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner .sub{display:block;font-weight:400;color:var(--ink);font-size:15px;margin-top:2px}
.banner .act{margin-top:8px}
/* next toilet card */
.next{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.next .e{font-size:40px;grid-row:span 2}
.next .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.next .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.next .h{grid-column:1/-1;color:var(--muted);font-size:14px;margin-top:6px}
.next.due{border-color:var(--warn);background:var(--warn-bg)}
.next.due .v{color:var(--warn)}
/* big actions */
.big{width:100%;border:0;border-radius:22px;padding:22px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left;background:var(--brand);color:#fff;box-shadow:0 6px 18px -8px rgba(134,85,198,.55)}
.big .e{font-size:44px;line-height:1}
.big b{display:block;font-size:22px}
.big span{font-size:15px;opacity:.9}
.big.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;padding:16px 18px}
.big.alt .e{font-size:32px} .big.alt b{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);line-height:1.2}
.stat.bad{background:var(--bad-bg);border-color:transparent} .stat.bad .n{color:var(--bad)}
.stat.good{background:var(--ok-bg);border-color:transparent} .stat.good .n{color:var(--ok)}
/* wizard */
.step{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}.dots i.on{background:var(--brand)}
h2.q{font-size:28px;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.hint{color:var(--muted);margin:0;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-height:132px;justify-content:center;text-align:center}
.choice .e{font-size:52px;line-height:1}
.choice b{font-size:18px;line-height:1.15}
.choice small{font-size:13px;color:var(--muted);line-height:1.2}
.choice.wide{grid-column:1/-1;flex-direction:row;min-height:84px;justify-content:flex-start;padding:14px 18px;gap:16px;text-align:left}
.choice.wide .e{font-size:40px}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)} .choice.no{border-color:var(--warn);background:var(--warn-bg)} .choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.choice:active{transform:scale(.98)}
.tip{border-radius:var(--r);padding:14px 16px;background:var(--brand-soft);display:flex;gap:12px;align-items:flex-start}
.tip .e{font-size:30px;line-height:1}
.tip b{display:block}
.tip.ok{background:var(--ok-bg)} .tip.ok b{color:var(--ok)}
.tip.no{background:var(--warn-bg)} .tip.no b{color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input,.field textarea{font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.field textarea{font-size:17px;min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer;min-width:64px;text-align:center}
.chip small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip[aria-pressed="true"] small{color:#fff;opacity:.85}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);flex:0 0 auto;padding:16px 18px}
.btn:disabled{opacity:.45}
/* done */
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px}
.done .tick{width:96px;height:96px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:52px;font-weight:700}
.done h2{margin:0;font-size:28px}
.done .next{width:100%;text-align:left}
/* list */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.item .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:62px}
.item .w{min-width:0}
.item .w small{display:block;color:var(--muted);font-size:13px}
.item .s{font-size:13px;font-weight:700}
.item .s.ok{color:var(--ok)} .item .s.wait{color:var(--warn)} .item .s.demo{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:16px}
.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:auto;padding-top:10px}
.foot b{color:var(--ink)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;word-break:break-all}
.pose{width:100%;max-width:380px;height:auto;display:block;margin:0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.pose .obj{fill:var(--bg);stroke:var(--muted);stroke-width:2}
.pose .stool{fill:var(--brand-soft);stroke:var(--brand-2);stroke-width:2}
.pose .fig{stroke:var(--brand);stroke-linecap:round;fill:none}
.pose .head{fill:var(--brand)}
.pose .floor{stroke:var(--line);stroke-width:3}
.pose .guide{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.pose .badge{fill:var(--ok)} .pose .bt{fill:var(--surface);font:700 13px var(--font)}
.pose .lbl{fill:var(--muted);font:700 11px var(--font)}
.steps3{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps3 li{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}
.steps3 li i{font-style:normal;flex:0 0 26px;height:26px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-size:14px}
.src{font-size:12.5px;color:var(--muted);margin:0}
.me{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.me b{color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.choice,.big,.btn{transition:transform .08s ease}.screen{animation:in .18s ease-out}@keyframes in{from{opacity:.85;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ Matty's Toilet Diary — offline-first app ============
   Plan source: Super Kids Toilet Training Plan (commenced 25 Sep 2026), supervised by Renee Collins, BCBA.
   Entries are kept on the phone and sent to the Google Sheet whenever there is internet. */
(function(){
"use strict";
const RENEE = "0422 457 363";
const LEVELS = {1:{min:90,label:"90 min"},2:{min:100,label:"100 min"},3:{min:120,label:"120 min"},4:{min:null,label:"Renee confirms"}};
const WHY = {
  timer:{e:"⏰",t:"Timer rang",s:"Scheduled sit",v:"⏰ Timer"},
  asked:{e:"🙋",t:"Matty asked",s:"Sign or PLQ",v:"🙋 Matty asked"},
  wake:{e:"🌅",t:"Woke up / poo signs",s:"Poo sit",v:"🌅 Wake-up / poo signs"},
  accident:{e:"⚠️",t:"Accident",s:"Wet or soiled",v:"⚠️ Accident"}
};
const WHAT = {
  wee:{e:"💧",t:"Wee",v:"💧 Wee",ok:true,wee:true},
  poo:{e:"💩",t:"Poo",v:"💩 Poo",ok:true},
  both:{e:"💧💩",t:"Wee + poo",v:"💧💩 Wee + poo",ok:true,wee:true},
  nothing:{e:"❌",t:"Nothing",v:"❌ Nothing",ok:false},
  small:{e:"⚠️",t:"Small accident",v:"⚠️ Small accident",acc:true},
  big:{e:"🚨",t:"Big accident",v:"🚨 Big accident",acc:true}
};

/* ---------- safe storage ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem("mtd_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("mtd_"+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- connection settings: from link (?api=...&key=...) or saved ---------- */
let cfg = store.get("cfg",{api:"",key:""});
try{
  const q = new URLSearchParams(location.search);
  if(q.get("api")){cfg={api:q.get("api"),key:q.get("key")||""};store.set("cfg",cfg);
    history.replaceState(null,"",location.pathname);}
}catch(e){}
const connected = ()=>!!cfg.api;

let log = store.get("log",[]);           // all entries made on this phone (kept 14 days)
let server = store.get("server",null);   // last status from the Google Sheet
let initials = store.get("initials","");   // support worker's full name on this phone
let nameAt = store.get("nameAt",0);
// a shared work phone may change hands between shifts, so the name is asked again after 10 hours
function curName(){return initials && (Date.now()-nameAt)<10*3600e3 ? initials : ""}
function setName(v){initials=String(v||"").replace(/\s+/g," ").trim();nameAt=Date.now();store.set("initials",initials);store.set("nameAt",nameAt)}
function nameField(){return '<div class="field"><label for="f-ini">Your full name</label><input id="f-ini" autocomplete="name" autocapitalize="words" maxlength="40" value="'+esc(curName())+'" placeholder="First and last name"><p class="hint">So the team knows who recorded this. Change it if this is not you.</p></div>'}
const okName=v=>String(v||"").trim().length>=3;
// Poo sitting position — Super Kids plan (2026) p.2 step 3; footstool detail from Renee Collins email (Oct 2026)
const POSE='<svg class="pose" viewBox="0 0 340 250" role="img" aria-label="Side view: Matty sits on the toilet with both feet on a footstool, knees higher than his hips, leaning forward with his elbows on his knees.">'
 +'<line class="floor" x1="10" y1="229" x2="330" y2="229"/>'
 +'<rect class="obj" x="26" y="46" width="36" height="90" rx="7"/>'
 +'<path class="obj" d="M58 118 H180 Q186 120 182 128 Q170 170 140 182 L146 228 H96 L102 182 Q70 170 60 128 Z"/>'
 +'<rect class="obj" x="54" y="110" width="130" height="9" rx="4"/>'
 +'<rect class="stool" x="204" y="180" width="88" height="48" rx="9"/>'
 +'<line class="guide" x1="96" y1="106" x2="236" y2="106"/><text class="lbl" x="240" y="110">hips</text>'
 +'<line class="fig" x1="112" y1="104" x2="158" y2="48" stroke-width="30"/>'
 +'<line class="fig" x1="112" y1="104" x2="204" y2="84" stroke-width="26"/>'
 +'<line class="fig" x1="204" y1="84" x2="236" y2="174" stroke-width="20"/>'
 +'<line class="fig" x1="236" y1="174" x2="270" y2="177" stroke-width="13"/>'
 +'<line class="fig" x1="160" y1="54" x2="196" y2="86" stroke-width="13"/>'
 +'<line class="fig" x1="196" y1="86" x2="224" y2="74" stroke-width="11"/>'
 +'<circle class="head" cx="172" cy="26" r="17"/>'
 +'<circle class="badge" cx="216" cy="58" r="12"/><text class="bt" x="216" y="63" text-anchor="middle">1</text>'
 +'<circle class="badge" cx="100" cy="66" r="12"/><text class="bt" x="100" y="71" text-anchor="middle">2</text>'
 +'<circle class="badge" cx="250" cy="206" r="12"/><text class="bt" x="250" y="211" text-anchor="middle">3</text>'
 +'</svg>';
const POSE_STEPS='<ol class="steps3"><li><i>1</i>Knees a little higher than his hips</li><li><i>2</i>Leaning forward (elbows on knees is OK)</li><li><i>3</i>Both feet flat on the footstool</li></ol>'
 +'<p class="src">Super Kids Toilet Training Plan (2026), p.2 step 3: feet up on the step and lean forward. Knees above hips: Renee Collins, Oct 2026.</p>';
let level = store.get("level",1);

/* demo examples so the preview shows a working state (cleared once connected) */
if(!connected() && !log.length){
  const now=Date.now(), m=60000;
  log=[
    mk({kind:"trip",why:"wake",what:"poo",reward:"yes",ts:now-245*m,initials:"Example worker",position:"yes",demo:true}),
    mk({kind:"trip",why:"timer",what:"wee",reward:"yes",ts:now-150*m,initials:"Example worker",demo:true}),
    mk({kind:"trip",why:"timer",what:"nothing",reward:"no",ts:now-62*m,initials:"Example worker",demo:true}),
    mk({kind:"trip",why:"timer",what:"wee",reward:"yes",ts:now-44*m,initials:"Example worker",demo:true})
  ];
}
if(connected() && log.some(x=>x.demo)){log=log.filter(x=>!x.demo);save();}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n){return String(n).padStart(2,"0")}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function tstr(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function nice(ts){const d=new Date(ts);let h=d.getHours(),ap=h>=12?"pm":"am";h=h%12||12;return h+":"+pad(d.getMinutes())+" "+ap}
function shiftOf(d){const h=d.getHours();return h>=6&&h<14?"AM":h>=14&&h<22?"PM":"Night"}
function mk(o){const d=new Date(o.ts||Date.now());return Object.assign({id:uid(),date:dstr(d),time:tstr(d),shift:shiftOf(d),level:level,note:"",sent:false},o,{ts:d.getTime()})}
function save(){const cut=Date.now()-14*864e5;log=log.filter(x=>x.ts>cut||!x.sent);store.set("log",log)}

/* ---------- plan logic ---------- */
function rewardRule(what){
  if(WHAT[what].ok) return "yes";
  if(what==="nothing"||what==="big") return "no";
  return null; // small accident: depends if he finishes on the toilet
}
function check(e){
  if(e.kind!=="trip") return "✓";
  const exp = e.what==="small" ? null : rewardRule(e.what);
  if(exp && e.reward!==exp) return exp==="yes"?"⚠ Reward missed":"⚠ No reward for this";
  return "✓";
}
// wees in a row at the current level, computed in time order (same rule as the Sheet)
function localStreaks(){
  const trips=log.filter(x=>x.kind==="trip"||x.kind==="level").sort((a,b)=>a.ts-b.ts);
  let s=0,g=0,prevL=null;
  for(const e of trips){
    if(e.kind==="level"){s=0;prevL=e.level;continue}
    const w=WHAT[e.what], lvlChg=prevL!=null&&e.level!==prevL;
    if(w.wee){s=lvlChg?1:s+1}
    else if(w.acc||(e.what==="nothing"&&e.why!=="wake")||lvlChg){s=0}
    if(e.why==="timer"&&w.wee) g++; else if(w.acc||(e.why==="timer"&&e.what==="nothing")) g=0;
    prevL=e.level;
  }
  return {streak:s,goal1:g};
}
function todayCounts(){
  const t=dstr(new Date()), today=log.filter(x=>x.kind==="trip"&&x.date===t);
  return {trips:today.length,acc:today.filter(x=>WHAT[x.what].acc).length,
    wees:today.filter(x=>WHAT[x.what].wee).length,asked:today.filter(x=>x.why==="asked").length};
}
function stats(){
  const L=localStreaks(), T=todayCounts(), pending=log.some(x=>!x.sent&&!x.demo);
  if(server && !pending && connected()){
    return {level:server.level||level,streak:server.streak??L.streak,goal1:server.goal1??L.goal1,
      acc:Math.max(server.accidentsToday??0,T.acc),trips:Math.max(server.tripsToday??0,T.trips),asked:Math.max(server.askedToday??0,T.asked),
      lastWeeTs:server.lastWeeTs||null,lastRetryTs:server.lastRetryTs||null};
  }
  return {level,streak:L.streak,goal1:L.goal1,acc:T.acc,trips:T.trips,asked:T.asked,lastWeeTs:null,lastRetryTs:null};
}
// next toilet time (a guide — the plan's timer on his iPad / Google Home is still the main reminder)
function nextDue(st){
  const trips=log.filter(x=>x.kind==="trip").sort((a,b)=>b.ts-a.ts);
  const lastWee=trips.find(x=>WHAT[x.what].wee||WHAT[x.what].acc);
  const lastNothing=trips.find(x=>x.what==="nothing"&&x.why!=="wake");
  let base=lastWee?lastWee.ts:null; if(st.lastWeeTs&&(!base||st.lastWeeTs>base)) base=st.lastWeeTs;
  let retry=lastNothing?lastNothing.ts:null; if(st.lastRetryTs&&(!retry||st.lastRetryTs>retry)) retry=st.lastRetryTs;
  const mins=LEVELS[st.level]&&LEVELS[st.level].min;
  if(retry&&(!base||retry>base)) return {ts:retry+15*60000,why:"Try again — no wee at the last sit (15–20 min)"};
  if(base&&mins) return {ts:base+mins*60000,why:"Level "+st.level+" timer ("+mins+" min after his last wee)"};
  return null;
}

/* ---------- sync with the Google Sheet ---------- */
let syncing=false;
async function sync(){
  if(!connected()||syncing||!navigator.onLine) return;
  const batch=log.filter(x=>!x.sent&&!x.demo).slice(0,40);
  syncing=true;
  try{
    if(batch.length){
      const res=await fetch(cfg.api,{method:"POST",body:JSON.stringify({key:cfg.key,entries:batch.map(toRow)})});
      const j=await res.json();
      if(j.ok){const done=new Set(j.saved||[]);log.forEach(x=>{if(done.has(x.id))x.sent=true});save()}
      else if(j.error) toast("Sheet said: "+j.error);
    }
    const r=await fetch(cfg.api+(cfg.api.includes("?")?"&":"?")+"action=status&key="+encodeURIComponent(cfg.key));
    const s=await r.json(); if(s.ok){server=s;store.set("server",s);if(s.level){level=+s.level;store.set("level",level)}}
  }catch(e){/* offline or blocked — entries stay on the phone and retry */}
  syncing=false; if(view==="home") render();
  if(log.some(x=>!x.sent&&!x.demo)&&batch.length===40) setTimeout(sync,500);
}
function toRow(e){
  if(e.kind==="level") return {id:e.id,kind:"level",date:e.date,time:e.time,level:e.level,initials:e.initials,note:e.note,device:dev()};
  if(e.kind==="daily") return {id:e.id,kind:"daily",date:e.date,time:e.time,osmalax:e.osmalax==="yes"?"✅ Yes":"❌ No",drinks:e.drinks,level:e.level,initials:e.initials,note:e.note,device:dev()};
  return {id:e.id,kind:"trip",ts:e.ts,date:e.date,time:e.time,shift:e.shift,why:WHY[e.why].v,what:WHAT[e.what].v,reward:e.reward==="yes"?"⭐ Yes":"✋ No",level:e.level,initials:e.initials,note:e.note,check:check(e),device:dev(),position:e.position==="yes"?"✅ Yes":e.position==="no"?"❌ Not quite":""};
}

function stepHead(n,total,back){
  let d='';for(let i=1;i<=total;i++) d+='<i class="'+(i<=n?'on':'')+'"></i>';
  return '<div class="top"><button class="iconbtn" id="b-back" aria-label="Back">←</button><div class="who"><div class="step"><span>Step '+n+' of '+total+'</span><span class="dots">'+d+'</span></div></div>'
    +'<button class="iconbtn" id="b-x" aria-label="Cancel">✕</button></div>';
}
function wire(back){$("#b-back").onclick=back;$("#b-x").onclick=()=>{draft=null;go("home")}}
function choice(key,o,cls){return '<button class="choice '+(cls||'')+'" data-k="'+key+'"><span class="e">'+o.e+'</span><b>'+o.t+'</b>'+(o.s?'<small>'+o.s+'</small>':'')+'</button>'}

  h+='</div><p class="hint">🙋 Matty asked = he used his sign or PLQ. That is Goal 2 — a big win!</p>';
  app.innerHTML='<div class="screen" style="display:flex;flex-direction:column;gap:14px">'+h+'</div>';
  wire(()=>{draft=null;go("home")});

}

  app.innerHTML='<div class="screen" style="display:flex;flex-direction:column;gap:14px">'+h+'</div>';
  $("#b-back").onclick=()=>go("home");
  $("#b-savecfg").onclick=()=>{if(okName($("#f-ini").value))setName($("#f-ini").value);
    cfg={api:$("#f-api").value.trim(),key:$("#f-key").value.trim()};store.set("cfg",cfg);
    if(connected()){log=log.filter(x=>!x.demo);save()} toast(connected()?"Saved — connecting…":"Saved");sync();go("home")};
  const cd=$("#b-cleardemo"); if(cd) cd.onclick=()=>{log=log.filter(x=>!x.demo);save();toast("Examples removed");go("home")};
}

function render(){
  ({home:homeView,posture:posture,howsit:howSit,why:whyView,what:whatView,acc:accView,finish:finishView,reward:rewardView,who:whoView,done:doneView,daily:dailyView,hist:histView,settings:settingsView}[view]||homeView)();
}
render(); sync();
setInterval(()=>{if(view==="home")render()},30000);

/* offline support when installed on a phone (ignored in previews that don't allow it) */
try{ if("serviceWorker" in navigator && location.protocol==="https:" ) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
})();
</script>
